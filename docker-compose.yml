services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: fullstack-backend
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: fullstack-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
