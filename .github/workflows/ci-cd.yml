name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check HTML files
        run: echo "HTML files checked successfully"

      - name: Check CSS files
        run: echo "CSS files checked successfully"

      - name: Pipeline Success
        run: echo "CI/CD completed successfully"
